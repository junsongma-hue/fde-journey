[project]
name = "fde-journey"
version = "0.1.0"
description = "60-day sprint from Senior PM to Forward Deployed Engineer"
authors = [{ name = "junsongma-hue", email = "junsong.ma@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "ipython>=8.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
